# Study variables and session specs. One study = one file; a new study gets a new file and study_id.
# Prolific study URL (one Prolific study per spec):
#   https://<host>/?PROLIFIC_PID={{%PROLIFIC_PID%}}&STUDY_ID={{%STUDY_ID%}}&SESSION_ID={{%SESSION_ID%}}&spec=<spec name>
# Test URL, one session:  /?sid=<user_id>--spec=<spec name>   (one session per user and spec)
study_id: dummy_emosent_binary--pilot
potato_config: config.yaml
assets_root: ../../assets/stimuli   # shared assets, relative to this folder
output_root: responses_data
host: 127.0.0.1
port: 8100
threads: 16                 # waitress worker threads
no_consent_code: NOCONSENT  # Prolific code for participants who decline consent (set its action on Prolific)
abandon_after_min: 30       # monitoring: an unfinished session with no answer for this long shows as abandoned

specs:
  dummy_envy:
    stimuli_name: dummy_emosent_binary
    graph_name: b=4--emb=spades
    propose_fn: graph/dmcmcp
    propose_params: {p_geom: 0.0, p_jump: 0.1, n_stuck: null}   # null = never
    n_draw: 20                     # draws per chain
    n_chain: 2                     # chains per session, one after the other
    question: Pick the sentence that you think expresses a higher degree of envious emotion than any other emotion.
    n_attention: 3                 # per chain
    attention_pass: 3              # per chain
    completion_code: DUMMY123        # Prolific completion code shown at the end
