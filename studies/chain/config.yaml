# Potato config: the study shell around the chain (URL login and the jsPsych chain page).
# The chain page's last screen (thank you + completion code) ends the study, so participants never
# reach the annotation phase below. Potato refuses a config without one, hence the placeholder item.
# Start it with `python run.py`, not `potato start`: run.py adds the /chain/* routes.
annotation_task_name: Forced-choice study
task_dir: .
output_annotation_dir: annotation_output/
data_files: [data/closing.jsonl]
item_properties: {id_key: id, text_key: text}

# one URL = one session: ?sid=<user_id>--spec=<spec> (parsed by chain_server.py;
# Prolific URLs are turned into a sid there first)
login: {type: url_direct, url_argument: sid}
user_config: {allow_all_users: true}
base_css: surveyflow/consent.css   # consent page styled like the task pages; hides Potato's navigation bar
ui: {theme: light}                 # always light (no dark mode, no toggle), like the task pages

annotation_schemes:
  - annotation_type: text
    name: comments
    description: Comments (optional)
    multiline: true

phases:
  order: [consent, chain, annotation]
  consent:
    type: consent
    title: Consent
    file: surveyflow/consent.jsonl
  chain:
    type: jspsych
    timeline: tasks/chain.js
    plugins: [html-button-response, call-function]
    save: incremental
